<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar sesión — Gastos Familiares</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

  <main class="login-wrapper">
    <section class="login-card">
      <h1 class="login-card__title">Gastos Familiares</h1>
      <p class="login-card__subtitle" id="loginSubtitle">Inicia sesión para continuar</p>

      <form id="formLogin" class="form-login">
        <div class="form-group">
          <label for="email">Correo</label>
          <input type="email" id="email" required placeholder="estudiante@colegio.edu" />
        </div>

        <div class="form-group">
          <label for="password">Contraseña</label>
          <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres" />
        </div>

        <div class="form-actions" style="grid-column: 1 / -1; flex-direction: column;">
          <button type="submit" class="btn btn--primary" id="btnAcceder">Iniciar sesión</button>
          <button type="button" class="btn btn--ghost" id="btnCambiarModo">Crear una cuenta nueva</button>
        </div>
      </form>
    </section>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/toast.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
